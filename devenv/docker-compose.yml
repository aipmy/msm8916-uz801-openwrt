services:
  chown-fix:
    image: alpine:latest
    user: "0"
    volumes:
      - dl:/dl
      - openwrt_tmp:/openwrt_tmp
    command: sh -c "chown -R 1000:1000 /dl /openwrt_tmp && chmod -R 777 /dl /openwrt_tmp"

  builder:
    build:
      context: ..
      dockerfile: devenv/Dockerfile
      args:
        OPENWRT_VERSION: ${OPENWRT_VERSION:-v25.12.5}
    container_name: msm8916-openwrt-build
    working_dir: /home/builder/openwrt
    entrypoint: ["/repo/devenv/entrypoint.sh"]
    command: ["/bin/bash"]
    stdin_open: true
    tty: true
    volumes:
      - ..:/repo
      - ../package_msm8916:/home/builder/openwrt/package/msm8916
      - ../msm89xx:/home/builder/openwrt/target/linux/msm89xx
      - /tmp/apk-3.0.5.tar.zst:/home/builder/openwrt/dl/apk-3.0.5.tar.zst:ro
      - dl:/home/builder/openwrt/dl
      - build_dir:/home/builder/openwrt/build_dir
      - staging_dir:/home/builder/openwrt/staging_dir
      - ../firmware/output:/repo_output
      - bin_dir:/home/builder/openwrt/bin
      - openwrt_tmp:/home/builder/openwrt/tmp
volumes:
  dl:
  build_dir:
  staging_dir:
  bin_dir:
  openwrt_tmp:


